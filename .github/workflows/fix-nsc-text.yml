name: NSCC one-time text fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '最高ランクが元芋2以降のプレイヤーの参加'
          new = '最高ランクが元汗2以降のプレイヤーの参加'
          if old not in s:
              print('Target text not found; nothing to change.')
              raise SystemExit(0)
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit text change and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No text change needed.'
            exit 0
          fi
          git commit -m '禁止事項の表記を修正'
          git push
          rm .github/workflows/fix-nsc-text.yml
          git add .github/workflows/fix-nsc-text.yml
          git commit -m '一時修正ワークフローを削除'
          git push
